name: Build & Release

# 触发方式：
#   1) 推送 v* 标签（例如 v0.41）—— 自动构建并发布 Release
#   2) 仓库网页手动触发：Actions -> Build & Release -> Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.41）；留空则自动读取 strings.py 中的 APP_VERSION'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build EXE and publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = ''
          if ("${{ github.ref }}" -like 'refs/tags/v*') {
            $ver = "${{ github.ref }}" -replace '^refs/tags/v', ''
          }
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "${{ github.event.inputs.version }}" }
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $src = Get-Content -Raw -Path strings.py
            if ($src -match 'APP_VERSION\s*=\s*"([^"]+)"') { $ver = $Matches[1] }
          }
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = '0.0.0' }
          "value=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved version: $ver"

      - name: Build single-file EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python build.py --distpath dist
          if (-not (Test-Path 'dist/FSRelocator.exe')) { throw 'Build failed: dist/FSRelocator.exe not found' }
          $f = Get-Item 'dist/FSRelocator.exe'
          Write-Host ("Built {0} ({1:N2} MB)" -f $f.Name, ($f.Length / 1MB))

      - name: Package assets
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ steps.ver.outputs.value }}"

          # README (placed in the zip next to the exe)
          $nl = [char]10
          $txt = @(
            "FS Relocator v$ver",
            "",
            "1) Double-click FSRelocator.exe to run. No installation needed.",
            "2) Before using it, enter a flight in Microsoft Flight Simulator (MSFS 2024 / 2020) at least once (aircraft loaded).",
            "3) On first launch Windows may show a SmartScreen warning. Click More info -> Run anyway (the app is not code-signed).",
            "4) The tool connects to the simulator automatically and centers the map on your aircraft.",
            "",
            "Designed by JerryXiao - Made with WorkBuddy"
          ) -join $nl
          Set-Content -Path 'dist/README.txt' -Value $txt -Encoding utf8

          # zip package (primary distribution: many forums / clouds / sites block raw .exe links; zip works everywhere)
          $zip = "FSRelocator-v$ver.zip"
          Compress-Archive -Path 'dist/FSRelocator.exe', 'dist/README.txt' -DestinationPath $zip -Force

          # 裸 exe（备用：方便直接下载的用户）
          $exe = "FSRelocator-v$ver.exe"
          Copy-Item 'dist/FSRelocator.exe' $exe -Force

          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Item $zip, $exe | ForEach-Object { Write-Host ("Asset ready: {0} ({1:N2} MB)" -f $_.Name, ($_.Length / 1MB)) }

      - name: Publish to Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ver   = "${{ steps.ver.outputs.value }}"
          $tag   = "v$ver"
          $zip   = "${{ steps.pkg.outputs.zip }}"
          $exe   = "${{ steps.pkg.outputs.exe }}"
          $title = "FS Relocator v$ver"

          $nl = [char]10
          $notes = @(
            "### FS Relocator v$ver",
            "",
            "Relocate your aircraft to any place or coordinate in Microsoft Flight Simulator 2024 / 2020. Single-file EXE with SimConnect.dll and an offline map basemap bundled - no installation required.",
            "",
            "**Interface**: bilingual (Chinese / English) and follows your sim's language automatically.",
            "",
            "**Download**",
            "- `$zip` - recommended (unzip, then run FSRelocator.exe)",
            "- `$exe` - run directly, no unzip needed",
            "",
            "**Before you start**: enter a flight in MSFS (aircraft loaded), then open this tool.",
            "",
            "> Not code-signed - Windows SmartScreen may show a warning on first launch. Click **More info -> Run anyway**."
          ) -join $nl
          Set-Content -Path 'release-notes.md' -Value $notes -Encoding utf8

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖上传附件..."
            gh release upload $tag $zip $exe --clobber
          } else {
            Write-Host "创建 Release $tag ..."
            gh release create $tag $zip $exe --title $title --notes-file 'release-notes.md'
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release 失败，退出码 $LASTEXITCODE" }
          Write-Host "发布完成：$tag -> $zip / $exe"
